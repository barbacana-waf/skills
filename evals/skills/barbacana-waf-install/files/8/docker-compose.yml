services:
  web:
    image: nginx:1.24
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/var/www/html:ro
    depends_on:
      - php
    restart: unless-stopped
  php:
    image: php:7.4-fpm
    volumes:
      - ./public:/var/www/html
    restart: unless-stopped
