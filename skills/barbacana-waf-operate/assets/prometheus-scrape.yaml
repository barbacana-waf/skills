# Add under scrape_configs: in prometheus.yml. Scrape the metrics_port, not the proxy port.
scrape_configs:
  # Static target (Compose, VM, systemd)
  - job_name: barbacana
    metrics_path: /metrics
    static_configs:
      - targets: ["barbacana:9090"]   # replace with host:metrics_port

  # Kubernetes pod discovery: pods labelled app=barbacana with a port named "metrics"
  # (use one job or the other, not both, or series are duplicated)
  - job_name: barbacana-k8s
    kubernetes_sd_configs:
      - role: pod
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app]
        regex: barbacana
        action: keep
      - source_labels: [__meta_kubernetes_pod_container_port_name]
        regex: metrics
        action: keep
      - source_labels: [__meta_kubernetes_namespace]
        target_label: namespace
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
